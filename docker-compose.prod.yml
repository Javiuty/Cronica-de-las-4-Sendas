# Despliegue. Detrás de Nginx Proxy Manager: el servicio `web` no publica nada
# al exterior, NPM lo alcanza por el nombre del contenedor en una red de Docker
# compartida.
#
#   docker network create proxy          # una vez, si aún no existe
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Y en NPM, un Proxy Host que apunte a  web  puerto  80.
#
# Ni la base de datos ni el backend salen de la red interna.

name: cronica-4-sendas

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRETO: ${JWT_SECRETO:?falta JWT_SECRETO}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?falta ANTHROPIC_API_KEY}
      CLAUDE_MODELO: ${CLAUDE_MODELO:-claude-opus-5}
      TOPE_DIARIO_CRONISTA: ${TOPE_DIARIO_CRONISTA:-500}
      TOPE_CRONISTA_POR_USUARIO: ${TOPE_CRONISTA_POR_USUARIO:-30}
      TOPE_REGISTROS_POR_IP: ${TOPE_REGISTROS_POR_IP:-5}
      TOPE_LOGINS_POR_IP: ${TOPE_LOGINS_POR_IP:-20}
      # El navegador y la API comparten origen, así que CORS no entra en juego.
      ORIGENES_PERMITIDOS: ${ORIGENES_PERMITIDOS:-}
    networks: [interna]

  web:
    build:
      context: ./frontend
      target: produccion
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - interna   # para llegar al backend
      - proxy     # para que NPM llegue aquí
    # Solo para mirar desde el propio VPS (túnel SSH). No sale a internet:
    # de la cara pública se encarga NPM.
    ports:
      - "127.0.0.1:${PUERTO_WEB:-8080}:80"

networks:
  interna:
  proxy:
    external: true
    name: ${RED_PROXY:-proxy}

volumes:
  datos-postgres:
