server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;

  # El backend, bajo el mismo origen: sin CORS y sin URL incrustada en el bundle.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Una encrucijada tarda diez o quince segundos en llegar.
    proxy_read_timeout 180s;
  }

  location ~* \.(jpg|jpeg|png|webp|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Una sola página: cualquier otra ruta cae en index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
